name: go
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xui_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xui_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xui_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -p 1 ./...
      - run: go test -race -count=1 -p 1 ./internal/integration ./internal/xui
      - run: go build ./...
